# /etc/nginx/sites-available/iron-ledger.conf
#
# This is a standalone server block on its own subdomain and its own
# upstream port (127.0.0.1:3101). It does not touch, include, or depend on
# whatever config file already serves Muskaan Travels on this same VM —
# drop this in as a new file, symlink it, reload Nginx, done.
#
# Replace `tracker.yourdomain.com` with your real subdomain before use.

server {
    listen 80;
    listen [::]:80;
    server_name tracker.yourdomain.com;

    # Certbot will rewrite this block to redirect to HTTPS and add its own
    # server block below once you run: certbot --nginx -d tracker.yourdomain.com
    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # DAREBEE PDF uploads + Gemini parsing can take a little while.
        proxy_read_timeout 75s;
        client_max_body_size 20m;
    }
}
